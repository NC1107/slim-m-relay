# SPDX-License-Identifier: Apache-2.0
#
# Publishes the relay image to GHCR on a version tag.
#
# The relay has no release-please setup, so a tag is the release trigger: push
# v0.1.0 and this builds, publishes, and signs. Images are built natively per
# architecture rather than under QEMU, matching the core repo, because the
# emulated arm64 build is slow and has burned us before with a silently
# host-arch binary.
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/nc1107/slim-m-relay
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          file: Dockerfile
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          sbom: true
          provenance: mode=max

      - name: export digest
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > "/tmp/digests/${{ matrix.arch }}"

      - uses: actions/upload-artifact@v7
        with:
          name: relay-image-digest-${{ matrix.arch }}
          path: /tmp/digests/${{ matrix.arch }}
          if-no-files-found: error

  merge:
    needs: [image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGE: ghcr.io/nc1107/slim-m-relay
    steps:
      - name: resolve version
        id: ver
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            version="0.0.0-dev"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v7
        with:
          pattern: relay-image-digest-*
          path: /tmp/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: create and inspect manifest
        id: manifest
        run: |
          version="${{ steps.ver.outputs.version }}"
          refs=""
          for f in /tmp/digests/*; do
            refs="${refs} ${IMAGE}@$(cat "$f")"
          done
          # `latest` is the rolling tag the deployment tracks for auto-updates;
          # the version and sha tags stay so an image can be pinned and traced
          # back to its commit.
          docker buildx imagetools create \
            -t "${IMAGE}:${version}" \
            -t "${IMAGE}:sha-${GITHUB_SHA}" \
            -t "${IMAGE}:latest" \
            ${refs}
          digest="$(docker buildx imagetools inspect "${IMAGE}:${version}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@v4.1.2

      - name: cosign sign (keyless)
        run: cosign sign --yes "${IMAGE}@${{ steps.manifest.outputs.digest }}"
